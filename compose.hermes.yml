name: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT to the configured prefix and task}

services:
  dev:
    image: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}-dev
    build:
      context: .
      dockerfile: Dockerfile.hermes
      args:
        OPENCODE_VERSION: "1.18.8"
        CODEX_VERSION: "0.145.0"
        CLAUDE_CODE_VERSION: "2.1.220"
        KIMI_CODE_VERSION: "0.29.2"
        THREADWIRE_VERSION: "0.1.9"
        PACKAGE_VERSION: "0.0.0"
        PROJECT_NAME: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
    user: "1000:1000"
    working_dir: /workspace
    environment:
      CODEX_HOME: /home/node/.codex
      HERMES_COMPOSE_PROJECT: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
      HERMES_SOURCE_PATH: /workspace
      HOME: /home/node
      NPM_CONFIG_CACHE: /home/node/.npm
      NODE_ENV: development
    labels:
      io.kaspernj.hermes-compose.project: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
      io.kaspernj.hermes-compose.service: dev
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${HERMES_SOURCE_PATH:?Set HERMES_SOURCE_PATH to the exact task checkout}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: node_modules
        target: /workspace/node_modules
      - type: volume
        source: npm_cache
        target: /home/node/.npm
      - type: volume
        source: codex_home
        target: /home/node/.codex
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  node_modules:
    labels:
      io.kaspernj.hermes-compose.project: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
      io.kaspernj.hermes-compose.purpose: node_modules
  npm_cache:
    labels:
      io.kaspernj.hermes-compose.project: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
      io.kaspernj.hermes-compose.purpose: npm_cache
  codex_home:
    labels:
      io.kaspernj.hermes-compose.project: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
      io.kaspernj.hermes-compose.purpose: codex_home

networks:
  default:
    labels:
      io.kaspernj.hermes-compose.project: ${HERMES_COMPOSE_PROJECT:?Set HERMES_COMPOSE_PROJECT}
      io.kaspernj.hermes-compose.network: default
